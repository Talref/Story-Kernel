[project]
name = "story-kernel"
version = "0.1.0"
description = "Experimental runtime for persistent fictional worlds"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=5.0,<7",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2.0,<3",
    "typer>=0.12,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
]

[project.scripts]
story-kernel = "story_kernel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/story_kernel"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

